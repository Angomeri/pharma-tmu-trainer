# Publishing: GitHub Settings -> Pages -> Deploy from a branch -> main -> /(root)
# This workflow checks code only. GitHub Pages deploys index.html without a build.
name: Test PHARMA TMU
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate learning bank, navigation, and prescriptions
        run: npm test
